<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constitution Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Constitution Quest
  </div>
  <div class="header-meta">
    <div class="xp-bar-wrap">
      <span id="xp-label">0 XP</span>
      <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
    </div>
    <span class="level-badge" id="level-badge">Lv 1</span>
    <span class="streak" id="streak-label"></span>
  </div>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" data-view="map">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 19.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    <span>Journey</span>
  </button>
  <button class="tab-btn" data-view="reader">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
    <span>Reader</span>
  </button>
  <button class="tab-btn" data-view="collection">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <span>Collection</span>
  </button>
  <button class="tab-btn" data-view="glossary">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    <span>Glossary</span>
  </button>
</nav>

<!-- Journey Map -->
<div class="view active" id="view-map">
  <div class="map-header">
    <h1>Your Constitution Journey</h1>
    <p>Follow the path from 1787 to today. Complete each chapter to unlock the next.</p>
  </div>
  <div id="map-container" class="map-journey"></div>
  <div style="margin-top:var(--space-6);padding:var(--space-4);background:var(--c-navy-100);border-radius:var(--radius-card)">
    <h3 style="font-family:var(--font-display);margin-bottom:var(--space-3);color:var(--c-navy-900)">Test Your Knowledge</h3>
    <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
      <button class="btn-secondary" onclick="window._cqStartQuiz('constitution-iq')">Constitution I.Q.</button>
      <button class="btn-secondary" onclick="window._cqStartQuiz('amendments-match')">Amendments Match</button>
    </div>
  </div>
</div>

<!-- Story Chapter -->
<div class="view" id="view-chapter">
  <div id="chapter-progress" class="chapter-progress"></div>
  <div id="chapter-content"></div>
</div>

<!-- Quiz Challenge -->
<div class="view" id="view-quiz">
  <div id="quiz-content"></div>
</div>

<!-- Reader -->
<div class="view" id="view-reader">
  <div class="reader-layout">
    <nav class="reader-nav" id="reader-nav"></nav>
    <div class="reader-content" id="reader-content"></div>
  </div>
</div>

<!-- Collection -->
<div class="view" id="view-collection">
  <div class="collection">
    <h2>Your Collection</h2>
    <div class="collection-section">
      <h3>Badges</h3>
      <div class="collection-grid" id="coll-badges"></div>
    </div>
    <div class="collection-section">
      <h3>Founder Cards</h3>
      <div class="collection-grid" id="coll-founders"></div>
    </div>
    <div class="collection-section">
      <h3>Amendment Stamps</h3>
      <div class="collection-grid" id="coll-stamps"></div>
    </div>
  </div>
</div>

<!-- Glossary -->
<div class="view" id="view-glossary">
  <h2 style="font-family:var(--font-display);color:var(--c-navy-900);margin-bottom:var(--space-4)">Glossary</h2>
  <input type="text" id="glossary-search" class="glossary-search" placeholder="Search terms..." autocomplete="off">
  <div class="glossary-list" id="glossary-list"></div>
</div>

<!-- Reward Popup -->
<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)window._cqClosePopup()">
  <div class="popup-box">
    <div class="popup-icon" id="popup-icon"></div>
    <h2 id="popup-title"></h2>
    <p id="popup-desc"></p>
    <p style="font-size:0.875rem;color:var(--c-muted);margin-bottom:var(--space-4)" id="popup-sub"></p>
    <button class="btn-primary" onclick="window._cqClosePopup()">Collect!</button>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  Design Prototype &bull; <a onclick="window._cqReset()">Reset journey</a>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
